name: 過去ラインと着順の結合検証
on:
  push:
    paths:
      - scripts/join_historical_lines.py
      - .github/workflows/join_historical_lines.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  join:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/join_historical_lines.py
      - name: Store matching audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/historical_line_join_audit.json results/historical_joined/
          if ! git diff --cached --quiet; then
            git commit -m "Store historical verified line and outcome joins"
            git pull --rebase -X ours
            git push
          fi
