name: 実ラインと選手能力の結合検査
on:
  push:
    paths:
      - scripts/merge_prerace_features.py
      - .github/workflows/merge_prerace_features.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit actual data join
        run: python scripts/merge_prerace_features.py
      - name: Save report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/verified_merge_report.json
          if ! git diff --cached --quiet; then
            git commit -m "Save verified pre-race feature merge report"
            git pull --rebase
            git push
          fi
