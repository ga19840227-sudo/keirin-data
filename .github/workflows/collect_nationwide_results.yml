name: 全国全レース結果収集・欠損監査
on:
  push:
    paths:
      - scripts/collect_nationwide_results.py
      - .github/workflows/collect_nationwide_results.yml
  workflow_dispatch:
  schedule:
    - cron: '20 13,15,17,21 * * *'
permissions:
  contents: write
concurrency:
  group: keirin-nationwide-results
  cancel-in-progress: false
jobs:
  nationwide:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect nationwide results
        run: |
          python -m py_compile scripts/collect_nationwide_results.py scripts/collect_postrace_results.py
          python scripts/collect_nationwide_results.py
          python scripts/collect_nationwide_results.py --date "$(TZ=Asia/Tokyo date -d 'yesterday' +%Y%m%d)"
      - name: Save collected results and coverage audit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/nationwide/
          if ! git diff --cached --quiet; then
            git commit -m "Save nationwide race results and coverage audit"
            git pull --rebase
            git push
          fi
