name: 競輪発走前ライン収集
on:
  schedule:
    - cron: '7 0-14 * * *'
  push:
    paths:
      - scripts/collect_prerace_hex.py
      - .github/workflows/collect_prerace_hex.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: keirin-prerace-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect publicly available pre-race line snapshots
        run: |\n          python scripts/collect_prerace_hex.py\n          python scripts/audit_saved_snapshots.py
          python scripts/merge_prerace_features.py
      - name: Commit collection audit and snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f snapshots/ results/snapshot_readiness_audit.json results/verified_merge_report.json
          if ! git diff --cached --quiet; then
            git commit -m "Record timestamped pre-race collection and audit"
            git pull --rebase
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prerace-collection-audit
          path: snapshots/
