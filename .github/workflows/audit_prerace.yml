name: 競輪・発走前データ監査
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/audit_prerace.py
      - .github/workflows/audit_prerace.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check source data availability
        run: python scripts/audit_prerace.py
      - uses: actions/upload-artifact@v4
        with:
          name: prerace-data-audit
          path: results/prerace_audit.json
