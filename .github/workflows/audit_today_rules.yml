name: 11月9日実レース15方式・オッズ検証
on:
  push:
    paths:
      - scripts/audit_today_rules.py
      - .github/workflows/audit_today_rules.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/audit_today_rules.py
      - name: Store audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/today_20261109_rules_audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Store November 9 verified pre-race rule audit"
            git pull --rebase -X ours
            git push
          fi
