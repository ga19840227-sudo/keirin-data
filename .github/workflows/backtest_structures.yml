name: 競輪3連単フォーメーション比較
on:
  push:
    paths:
      - scripts/backtest_structures.py
      - .github/workflows/backtest_structures.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run trifecta structure comparison
        run: python scripts/backtest_structures.py
      - name: Save backtest summary to repository
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/structure_backtest.csv
          if ! git diff --cached --quiet; then
            git commit -m "Save trifecta structure backtest results"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trifecta-structure-results
          path: results/structure_backtest.csv
