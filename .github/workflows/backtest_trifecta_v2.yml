name: 競輪3連単モデルV2検証
on:
  push:
    paths:
      - scripts/backtest_trifecta_v2.py
      - .github/workflows/backtest_trifecta_v2.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run chronological trifecta baseline
        run: python scripts/backtest_trifecta_v2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trifecta-v2-results
          path: results/trifecta_v2_summary.csv
