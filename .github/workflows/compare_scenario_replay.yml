name: 3連単新旧モデル過去比較
on:
  push:
    paths:
      - scripts/compare_scenario_replay.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run paired historical comparison
        run: python scripts/compare_scenario_replay.py
      - name: Save comparison
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/prediction_accuracy/scenario_replay.json
          if ! git diff --cached --quiet; then
            git commit -m "Save historical scenario replay comparison"
            git fetch origin main
            git rebase -X theirs origin/main
            git push origin HEAD:main
          fi
