name: 競輪ラインSBH発走前オッズ監査
on:
  push:
    paths:
      - scripts/audit_line_sbh_odds.py
      - .github/workflows/audit_line_sbh_odds.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit actual available pre-race data
        run: python scripts/audit_line_sbh_odds.py
      - name: Persist audit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/line_sbh_odds_audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Record verified line SBH odds audit"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: line-sbh-odds-audit
          path: results/line_sbh_odds_audit.json
