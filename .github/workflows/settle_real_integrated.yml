name: 実総合予測の着順・払戻照合
on:
  push:
    paths:
      - scripts/settle_real_integrated.py
      - .github/workflows/settle_real_integrated.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/settle_real_integrated.py
      - name: Save settlement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/real_integrated_settlement.json
          if ! git diff --cached --quiet; then
            git commit -m "Save real integrated forecast settlement"
            git pull --rebase
            git push
          fi
