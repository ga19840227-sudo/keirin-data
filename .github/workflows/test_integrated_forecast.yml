name: 競輪総合展開予測の動作確認
on:
  push:
    paths:
      - scripts/integrated_race_forecast.py
      - scripts/test_integrated_race_forecast.py
      - .github/workflows/test_integrated_forecast.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrated-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify integrated prediction and guards
        run: python scripts/test_integrated_race_forecast.py
      - name: Persist test report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/integrated_smoke_test.json
          if ! git diff --cached --quiet; then
            git commit -m "Save integrated forecast smoke test"
            git fetch origin main
            git rebase -X theirs origin/main
            git push origin HEAD:main
          fi
