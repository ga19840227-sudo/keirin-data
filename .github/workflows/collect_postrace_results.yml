name: 発走後の結果自動照合
on:
  push:
    paths:
      - scripts/collect_postrace_results.py
      - .github/workflows/collect_postrace_results.yml
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
concurrency:
  group: keirin-auto-settlement
  cancel-in-progress: false
jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python scripts/collect_postrace_results.py
          python scripts/evaluate_prediction_accuracy.py
      - name: Save audit and results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/auto_settlement/ results/prediction_accuracy/
          if ! git diff --cached --quiet; then
            git commit -m "Update postrace settlement and audit"
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; exit 1; }
            git push
          fi
