name: 実取得スナップショットの中身検査
on:
  push:
    paths:
      - scripts/audit_saved_snapshots.py
      - .github/workflows/audit_saved_snapshots.yml
      - snapshots/**
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/audit_saved_snapshots.py
      - name: Save actual snapshot audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/snapshot_readiness_audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Save actual snapshot readiness audit"
            git pull --rebase
            git push
          fi
