name: 実データSBH抽出と総合展開予測
on:
  push:
    paths:
      - scripts/parse_hex_prerace_riders.py
      - .github/workflows/parse_real_prerace.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  real-forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract real rider abilities and SBH
        run: python scripts/parse_hex_prerace_riders.py
      - name: Run integrated forecast on valid actual pre-race snapshots
        run: |
          mkdir -p results/real_integrated_predictions
          for f in results/verified_model_inputs/*.json; do
            [ -f "$f" ] || continue
            id=$(basename "$f")
            python scripts/integrated_race_forecast.py "$f" --out "results/real_integrated_predictions/$id"
          done
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/hex_rider_parse_audit.json results/verified_model_inputs/ results/real_integrated_predictions/
          if ! git diff --cached --quiet; then
            git commit -m "Save verified real-race SBH extraction and integrated forecasts"
            git pull --rebase
            git push
          fi
