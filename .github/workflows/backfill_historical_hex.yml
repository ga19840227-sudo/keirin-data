name: 過去のライン・番手・SBH収集
on:
  schedule:
    - cron: '25 2 * * *'
  push:
    paths:
      - scripts/backfill_historical_hex.py
      - .github/workflows/backfill_historical_hex.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backfill:
    concurrency:
      group: historical-hex-backfill
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch archived racecards with provenance
        run: |
          python -m py_compile scripts/backfill_historical_hex.py scripts/collect_prerace_hex.py scripts/parse_hex_prerace_riders.py
          python scripts/backfill_historical_hex.py --start 2026-10-15 --end 2026-10-18 --limit 180
      - name: Save historical audit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/historical_hex_backfill_audit.json
          if [ -d historical_hex ]; then git add -f historical_hex/; fi
          if ! git diff --cached --quiet; then
            git commit -m "Archive historical line, position and SBH evidence"
            git fetch origin main
            git rebase -X ours origin/main || { git rebase --abort; exit 1; }
            git push
          fi
